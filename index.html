<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="./assets/favicon.png" />
  <title>Fire Emblem Adventures</title>
</head>
<body>
  <main>
    <header><div><p class="eyebrow">FIRE EMBLEM ADVENTURES</p><h1>Stand against the swarm.</h1></div><span class="version">SURVIVAL</span></header>
    <section class="game-shell" aria-label="Enemy swarm game">
      <div class="hud"><span id="hero-name">Chrom</span><span id="health">HP 100 / 100</span><span id="wave">Wave 1</span><span id="kills">Defeated 0</span></div>
      <div id="game" tabindex="0" aria-label="Game field. Use WASD or arrow keys to move and Space to attack."></div>
      <section id="menu" class="overlay" aria-labelledby="menu-title">
        <p class="eyebrow">CHOOSE YOUR HERO</p><h2 id="menu-title">Hold the line.</h2><p>Move, strike, and survive increasingly large enemy waves.</p>
        <div class="heroes" role="group" aria-label="Choose character">
          <button class="hero selected" data-character="chrom" aria-pressed="true"><img src="./assets/chromPortrait1.png" alt="" />Chrom</button>
          <button class="hero" data-character="lucina" aria-pressed="false"><img src="./assets/lucinaPortrait1.png" alt="" />Lucina</button>
          <button class="hero" data-character="frederick" aria-pressed="false"><img src="./assets/frederickPortrait1.png" alt="" />Frederick</button>
        </div>
        <button id="start" class="primary" disabled>Loading assets…</button>
      </section>
      <section id="end" class="overlay" hidden><p class="eyebrow">THE BATTLE IS OVER</p><h2>You held your ground.</h2><p id="result"></p><button id="restart" class="primary">Try again</button><button id="choose">Choose hero</button></section>
      <div id="notice" role="status" aria-live="polite">Loading the battlefield…</div>
    </section>
    <footer><p><kbd>WASD</kbd> / <kbd>↑ ↓ ← →</kbd> Move <kbd>Space</kbd> Attack <kbd>P</kbd> Pause</p><div class="actions"><button id="pause" disabled>Pause</button><button id="music" class="volume-button" aria-label="Unmute audio" title="Unmute audio" aria-pressed="false" disabled>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6 9H3v6h3l5 4Z" />
          <path class="volume-muted" d="m16 9 6 6m0-6-6 6" />
          <path class="volume-on" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" />
        </svg>
      </button><button id="fullscreen">Fullscreen</button></div></footer>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
