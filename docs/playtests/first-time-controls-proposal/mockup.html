<!doctype html><meta charset="utf-8"><title>First battle controls — interactive proposal</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#112729;color:#fff0ca;font-family:Georgia,serif}.stage{position:relative;width:min(100vw,1688px);aspect-ratio:1688/780;background:url('../radial-commands-1.1.9/party-844-full.png') center/100% 100% no-repeat}.scrim{position:absolute;inset:0;background:#071722a8}.highlight{position:absolute;border:3px solid #ffe596;border-radius:50%;box-shadow:0 0 0 4px #173f55,0 0 25px #ffe59660;pointer-events:none}.highlight.square{border-radius:6px}.card{position:absolute;left:28%;top:27%;width:35%;padding:14px 16px;color:#34281c;background:#e7ce91 url('../../../public/assets/ui-parchment.png') center/100% 100%;border:2px solid #b29353;box-shadow:0 8px 25px #0008;border-radius:7px}.eyebrow{font:12px Arial,sans-serif;letter-spacing:.08em;color:#5b4c32;margin-bottom:10px}h1{margin:0 0 8px;font-size:22px}p{font:15px/1.35 Arial,sans-serif;margin:0 0 10px}.badge{font:14px Arial,sans-serif;background:#183e57;color:#fff0c6;padding:6px 8px;display:inline-block;border-radius:3px;margin-bottom:12px}.footer{display:flex;gap:8px;align-items:center;justify-content:space-between}button{min-height:44px;border:1px solid #806331;background:#d6b56c;color:#34281c;font:15px Georgia;padding:5px 9px;white-space:nowrap;cursor:pointer}.skip{background:transparent}.status{position:absolute;top:6%;left:36%;width:28%;text-align:center;background:#173e55;padding:6px;font:14px Arial}.modes{padding:10px;display:flex;gap:10px;flex-wrap:wrap;font:14px Arial}.modes label{padding:10px}.tip{font-size:12px;color:#65533a} @media(min-width:1100px){.card{padding:26px}h1{font-size:30px}p{font-size:21px}.eyebrow,.badge{font-size:17px}button{font-size:22px}}
</style>
<div class="stage"><div class="scrim"></div><div class="status">Battle paused · One-time controls guide</div><div class="highlight"></div><div class="highlight second" style="display:none"></div><div class="preview-icon" style="position:absolute;color:#fff0ca;font-size:30px;pointer-events:none;display:none"></div><section class="card"><div class="eyebrow"></div><h1></h1><div class="badge"></div><p></p><div class="tip">Shown once. Replay anytime from Pause → Controls.</div><div class="footer"><button class="skip">Skip & begin</button><button class="back">Back</button><button class="next">Next →</button></div></section></div>
<div class="modes"><label><input type="checkbox" id="desktop"> Desktop instructions</label><label><input type="checkbox" id="staff"> Healing staff equipped</label><label><input type="checkbox" id="solo"> Solo party</label><span id="result"></span></div>
<script>
let index=0;const $=s=>document.querySelector(s);const defs=[
['Move','Drag the left stick to move.','WASD / Arrow keys','Move with WASD or the arrow keys.',[12.5,65,14.5,31],'circle'],
['Aim & attack','Hold and drag the right stick toward your target to attack.','Mouse + Space / Left click','Aim with the mouse, including swords. Press Space or left-click to attack.',[66.1,41.5,15.5,34],'circle'],
['Switch hero','Tap either arrow to control the previous or next living party member.','Q / E','Press Q or E to control the previous or next living party member.',[59.8,52,28,13],'square'],
['Switch weapon','Tap your weapon icon to cycle this character’s equipped weapons.','F','Press F to cycle this character’s equipped weapons.',[79.8,88,7.6,11],'square'],
['Call for help','Tap the flag to rally nearby companions to you. Rally lasts 10 seconds, then must recharge.','R','Press R to rally nearby companions to you for 10 seconds.',[62.5,88,5,11],'square'],
['Guard','Hold the shield to block frontal physical attacks. Guard uses stamina.','Ctrl / Right mouse','Hold Ctrl or the right mouse button to guard frontal physical attacks. Guard uses stamina.',[67.8,88,5,11],'square'],
['Heal with a staff','With a staff equipped, tap + to heal yourself. Hold and drag the right stick toward an ally to heal them.','Shift + Space','With a staff equipped, Shift + Space heals yourself. Space heals an ally.',[74.2,88,5,11],'square']];
function steps(){return defs.filter((d,i)=>(i!==6||$('#staff').checked)&&(!$('#solo').checked||![2,4].includes(i)))}
function render(){const a=steps();index=Math.min(index,a.length-1);const d=a[index],desktop=$('#desktop').checked;$('.eyebrow').textContent=`QUICK CONTROLS · ${index+1} / ${a.length}`;$('h1').textContent=d[0];$('.badge').textContent=desktop?d[2]:'';$('.badge').style.display=desktop?'inline-block':'none';$('.tip').style.display='block';$('.card p').textContent=desktop?d[3]:d[1];$('.highlight').style.cssText=`left:${d[4][0]}%;top:${d[4][1]}%;width:${d[4][2]}%;height:${d[4][3]}%;display:${desktop?'none':'block'}`;$('.highlight').className='highlight '+(d[5]==='square'?'square':'');$('.second').style.display=!desktop&&d[0]==='Switch hero'?'block':'none';if(!desktop&&d[0]==='Switch hero'){$('.highlight').style.cssText='left:59.8%;top:52%;width:5.5%;height:13%';$('.second').className='highlight square second';$('.second').style.cssText='display:block;left:82.2%;top:52%;width:5.5%;height:13%'}$('.preview-icon').style.display=!desktop&&['Guard','Heal with a staff'].includes(d[0])?'block':'none';$('.preview-icon').textContent=d[0]==='Guard'?'⛨':'+';$('.preview-icon').style.left=d[0]==='Guard'?'69%':'75.1%';$('.preview-icon').style.top='89%';$('.back').style.visibility=index===0?'hidden':'visible';$('.stage').style.backgroundImage="url('../"+(desktop?'compact-party-hud-review/1280-full.png':$('#staff').checked?'centered-commands-1.1.10/844-full-staff-four.png':'radial-commands-1.1.9/party-844-full.png')+"')";$('.next').textContent=index===a.length-1?'Begin battle':'Next →'}
$('.next').onclick=()=>{if(index<steps().length-1){index++;render()}else $('#result').textContent='Proposal: save completion, dismiss guide, then start battle.'};$('.back').onclick=()=>{index=Math.max(0,index-1);render()};$('.skip').onclick=()=>$('#result').textContent='Proposal: save skipped state, dismiss guide, then start battle.';document.querySelectorAll('input').forEach(i=>i.onchange=()=>{index=0;render()});render();
</script>
