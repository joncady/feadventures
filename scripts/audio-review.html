<!doctype html><html lang="en"><meta charset="utf-8"><title>Awakening audio audition</title><style>body{font:16px system-ui;background:#17212d;color:#eee;max-width:1100px;margin:30px auto;padding:20px}input,select,button{font:inherit;padding:8px}input{width:50%}li{padding:8px;border-bottom:1px solid #435064;overflow-wrap:anywhere}button{margin-right:12px}audio{display:block;width:100%;margin:15px 0}#player{position:sticky;top:0;background:#17212d;padding:12px}small{color:#bdc9db}</style><h1>Awakening audio audition</h1><p>Search a character name or original filename. These are the full downloaded archives; filenames do not guarantee what a clip says.</p><div id="player"><strong id="selected">Select a clip to listen</strong><audio controls preload="none"></audio></div><input aria-label="Search clips" placeholder="Morgan, CHROM, FIRE, ATTACK…"><select aria-label="Audio category"><option>All</option><option>Character voices</option><option>Robin voices</option><option>Effects</option></select><p id="count"></p><ul></ul><button id="more" hidden>Show 100 more</button><script>
let clips=[],limit=100;const query=document.querySelector('input'),category=document.querySelector('select'),list=document.querySelector('ul'),audio=document.querySelector('audio');
function render(){const filtered=clips.filter(c=>(category.value==='All'||c.group===category.value)&&`${c.name} ${c.character} ${c.group}`.toLowerCase().includes(query.value.toLowerCase()));document.querySelector('#count').textContent=`${filtered.length} matches · showing ${Math.min(limit,filtered.length)}`;document.querySelector("#more").hidden=filtered.length<=limit;list.replaceChildren();for(const c of filtered.slice(0,limit)){const li=document.createElement('li'),button=document.createElement('button'),label=document.createElement('span');button.textContent='Play';label.textContent=`${c.character?c.character+' · ':''}${c.name} (${c.group})`;button.onclick=()=>{document.querySelector('#selected').textContent=c.name;audio.src=c.file;audio.play().catch(()=>{});};li.append(button,label);list.append(li);}}
query.oninput=category.onchange=()=>{limit=100;render()};document.querySelector("#more").onclick=()=>{limit+=100;render()};fetch('catalog.json').then(r=>r.json()).then(data=>{clips=data;render()});
</script></html>
